[project]
name = "penguin-species-prediction"
version = "0.1.0"
description = "A small ML prediction API focused on learning CI/CD."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141,<1.0",
    "joblib>=1.5,<2.0",
    "pandas>=2.3,<3.0",
    "scikit-learn>=1.9,<2.0",
    "uvicorn[standard]>=0.52,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.16,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]